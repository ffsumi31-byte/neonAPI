name: Publish ApiDuck connectors

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/connectors-release.yml"
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: bash -n connectors/linux/start-apiduck.sh
      - name: Package platform downloads
        shell: bash
        run: |
          mkdir -p release/windows release/linux
          cp connectors/windows/Start-ApiDuck.ps1 release/windows/
          cp connectors/README.md release/windows/README.txt
          cp connectors/linux/start-apiduck.sh release/linux/
          cp connectors/README.md release/linux/README.txt
          chmod +x release/linux/start-apiduck.sh
          (cd release && zip -r apiduck-windows.zip windows)
          tar -czf release/apiduck-linux.tar.gz -C release linux
          cd release
          sha256sum apiduck-windows.zip apiduck-linux.tar.gz > SHA256SUMS.txt
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          tag="$GITHUB_REF_NAME"
          if [[ "$GITHUB_REF_TYPE" == branch ]]; then
            tag=v0.1.0
            if gh release view "$tag" >/dev/null 2>&1; then
              exit 0
            fi
          fi
          gh release create "$tag" release/apiduck-windows.zip release/apiduck-linux.tar.gz release/SHA256SUMS.txt \
            --target "$GITHUB_SHA" --title "ApiDuck $tag" --generate-notes
